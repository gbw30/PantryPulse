name: Application tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pantrypulse
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: pantrypulse_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pantrypulse -d pantrypulse_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      PP_TEST_DATABASE_URL: postgresql+psycopg://pantrypulse:test_only@127.0.0.1:5432/pantrypulse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@11.13.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: uv sync --frozen --directory apps/api
      - run: npm run test:config
      - run: npm run typecheck
      - run: npm run lint
      - run: uv run --frozen --directory apps/api ruff check .
      - run: npm run test:coverage
      - name: API, PostgreSQL transactions/migrations and real Linux worker processes (no skips)
        run: uv run --frozen --directory apps/api pytest -q --require-no-skips --junitxml=../../artifacts/testing/api-junit.xml
      - run: npm run build
      - run: npm exec --workspace @pantrypulse/web -- playwright install --with-deps chromium
      - name: Browser journeys and real process-health smoke
        run: npm run test:e2e
      - name: Document remaining story gaps
        if: always()
        run: npm run test:stories
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            artifacts/testing/
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: warn
