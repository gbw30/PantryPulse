name: PantryPulse Linux gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pantrypulse-${{ github.ref }}
  # Superseded PR runs cancel; main runs always finish so post-merge verification completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Merge gate, capped at 2 minutes: static checks only (user decision 2026-10-25).
  # Backend tests, build and browser journeys run in the parallel `full` job.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: npm ci --no-audit --no-fund
      - run: npm run test:config
      - run: npm run typecheck && npm run lint && npm run test:unit --workspace @pantrypulse/web
      # Locked ruff version from apps/api/uv.lock, without syncing the full API environment.
      - run: uvx ruff@0.17.2 check .
        working-directory: apps/api

  # Docs-only PRs skip `full` (user decision 2026-11-11): every changed file is Markdown under docs/ or
  # at the root that no test reads (scripts/quality/docs-only.cjs). Main pushes always run `full`.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      # The PR merge commit's first parent is the base branch, so HEAD^1..HEAD is what the PR changes.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: classify
        run: |
          docs_only=false
          # If the script fails, this step fails, and `full` runs (see its `if`).
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            docs_only=$(node scripts/quality/docs-only.cjs HEAD^1 HEAD)
          fi
          echo "Docs-only: $docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  # Full gates (backend, PostgreSQL, build, browser journey). Runs on every PR except docs-only ones and
  # on every main push, in parallel with verify, but no longer gates merges (user decision 2026-10-25:
  # verify capped at 2 min).
  full:
    needs: changes
    # !cancelled(): if the classifier itself fails, `full` still runs rather than being skipped.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pantrypulse
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: pantrypulse_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pantrypulse -d pantrypulse_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PP_TEST_DATABASE_URL: postgresql+psycopg://pantrypulse:isolated_test_only@127.0.0.1:5432/pantrypulse_test
      PP19_TEST_DATABASE_URL: postgresql+psycopg://pantrypulse:isolated_test_only@127.0.0.1:5432/pantrypulse_test
      PP19_TEST_SCHEMA_ISOLATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: uv sync --frozen --project apps/api
      - name: All backend tests including actual Linux processes and PostgreSQL
        run: uv run --frozen --directory apps/api pytest -q --junitxml=../../artifacts/backend.xml
      - name: Reject skipped backend gates
        run: python scripts/quality/require-test-evidence.py artifacts/backend.xml
      - run: apps/api/.venv/bin/python scripts/or/verify_budget_evidence.py docs/optimization/evidence/budget-sweep-v2.json
      - run: npm run contracts:check --workspace @pantrypulse/web
      - run: npm run build
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: apps/web
      - name: Seed and start isolated connected demo
        run: |
          mkdir -p artifacts
          export DATABASE_URL_UNPOOLED="$PP_TEST_DATABASE_URL"
          apps/api/.venv/bin/python apps/api/scripts/load_optimization_demo.py --schema ppor_demo_ci --output artifacts/demo.json
          apps/api/.venv/bin/python scripts/quality/demo-ci-env.py artifacts/demo.json >> "$GITHUB_ENV"
      # GitHub's Ubuntu 24.04 image restricts unprivileged user namespaces through AppArmor.
      - name: Allow unprivileged user namespaces for the no-egress backend
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Real browser, proxy, database and worker journey
        env:
          DATABASE_URL: ${{ env.PP_TEST_DATABASE_URL }}
          PP_DATABASE_SCHEMA: ppor_demo_ci
          PP_ALLOWED_ORIGINS: http://127.0.0.1:3000
          PP_COOKIE_SECURE: 'false'
          PANTRYPULSE_API_ORIGIN: http://127.0.0.1:8000
          PP_RUN_CONNECTED: '1'
          PP_E2E_PRODUCTION: '1'
          PP_E2E_NO_EGRESS: '1'
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ../../artifacts/browser.xml
        run: |
          # V1-A10: the API and worker run with no outbound network, each in its own network
          # namespace (unshare -rn). They reach PostgreSQL through a unix socket and the API serves
          # on one; netns-bridge.py forwards both to TCP on the host.
          PY=$PWD/apps/api/.venv/bin/python
          NET=$(mktemp -d /tmp/ppnet.XXXXXX)
          mkdir "$NET/pg"
          "$PY" scripts/quality/netns-bridge.py "unix:$NET/pg/.s.PGSQL.5432" tcp:127.0.0.1:5432 > artifacts/bridge-pg.log 2>&1 &
          "$PY" scripts/quality/netns-bridge.py tcp:127.0.0.1:8000 "unix:$NET/api.sock" > artifacts/bridge-api.log 2>&1 &
          for _ in $(seq 100); do [ -S "$NET/pg/.s.PGSQL.5432" ] && break; sleep 0.1; done
          NETNS_DB=$("$PY" -c 'import os, sys; from sqlalchemy.engine import make_url; u = make_url(os.environ["DATABASE_URL"]); print(u.set(host=None, port=None, query={**u.query, "host": sys.argv[1], "port": str(u.port or 5432)}).render_as_string(hide_password=False))' "$NET/pg")
          # Prove the namespace has no route out before trusting the offline journey.
          unshare -rn "$PY" -c 'import errno, socket
          try: socket.create_connection(("1.1.1.1", 443), timeout=3)
          except OSError as e: raise SystemExit(0 if e.errno == errno.ENETUNREACH else f"unexpected {e!r}")
          raise SystemExit("egress is open inside the namespace")'
          (cd apps/api && DATABASE_URL="$NETNS_DB" exec unshare -rn "$PY" -m uvicorn app.main:app --uds "$NET/api.sock") > artifacts/api.log 2>&1 &
          (cd apps/api && DATABASE_URL="$NETNS_DB" exec unshare -rn "$PY" -m app.workers.supervisor --registry production --schema ppor_demo_ci) > artifacts/worker.log 2>&1 &
          apps/api/.venv/bin/python scripts/quality/wait-demo.py
          npm run test:e2e --workspace @pantrypulse/web -- --workers=1 --reporter=list,junit
          python scripts/quality/require-test-evidence.py artifacts/browser.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pantrypulse-linux-evidence
          path: |
            artifacts/*.xml
            artifacts/*.log
            apps/web/test-results/
          if-no-files-found: error
